services:
  db:
    image: postgres:16-alpine
    container_name: sebm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sebm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sebm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sebm}
    ports:
      - "5432:5432"
    volumes:
      - sebm_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sebm} -d ${POSTGRES_DB:-sebm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sebm_pgdata: